name: Pipeline

# PR para a main: so o gate.  Push na main: gate -> versao -> imagem -> release -> staging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nunca duas implantacoes da main ao mesmo tempo.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  # 1. Gate: lint, testes e cobertura, em matriz de versoes do Python.
  gate:
    name: Gate (py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes e cobertura (minimo 80%)
        run: pytest

  # 2 e 3. Derivar a versao dos Conventional Commits e publicar a imagem no GHCR.
  publicar:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permissao minima para publicar no GHCR
    outputs:
      versao: ${{ steps.versao.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historico completo: a versao vem dos commits desde a ultima tag

      - name: Derivar a versao dos Conventional Commits
        id: versao
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: '/^\w+(\(.+\))?!:|BREAKING CHANGE/' # feat!: ...  ou  BREAKING CHANGE
          minor_pattern: "/^feat/" # feat: ...  ->  minor
          search_commit_body: true # demais commits (fix, docs, ci...) -> patch
          version_format: "${major}.${minor}.${patch}"

      - name: Mostrar a versao derivada
        run: |
          echo "Versao anterior: ${{ steps.versao.outputs.previous_version }}"
          echo "Nova versao:     ${{ steps.versao.outputs.version }} (${{ steps.versao.outputs.version_type }})"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token efemero do proprio job

      - name: Garantir tag imutavel (a versao ainda nao pode existir no registry)
        env:
          VERSAO: ${{ steps.versao.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGEM:$VERSAO" > /dev/null 2>&1; then
            echo "::error::$IMAGEM:$VERSAO ja existe. Tags sao imutaveis: faca um novo commit para gerar outra versao."
            exit 1
          fi
          echo "Tag $VERSAO livre."

      - name: Build e push da imagem (SemVer + sha-<commit>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSAO=${{ steps.versao.outputs.version }}
          tags: |
            ${{ env.IMAGEM }}:${{ steps.versao.outputs.version }}
            ${{ env.IMAGEM }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Release no GitHub com notas geradas automaticamente.
  release:
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag vX.Y.Z e o release
    steps:
      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.publicar.outputs.versao }}
          name: v${{ needs.publicar.outputs.versao }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Imagem publicada no GHCR:
            - `${{ env.IMAGEM }}:${{ needs.publicar.outputs.versao }}`
            - `${{ env.IMAGEM }}:sha-${{ github.sha }}`

  # 5. Implantar em staging via docker compose, com healthcheck.
  staging:
    needs: publicar
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Implantar a mesma imagem publicada (construida uma vez)
        run: bash scripts/deploy.sh "${{ needs.publicar.outputs.versao }}"
