name: Rollback (demonstracao)

# Disparo manual: Actions -> "Rollback (demonstracao)" -> Run workflow.
# Sobe a versao atual em staging, volta para a anterior e confirma pelo /health.
on:
  workflow_dispatch:
    inputs:
      atual:
        description: "Versao que esta no ar (ex.: 2.1.1)"
        required: true
      anterior:
        description: "Versao para a qual voltar (ex.: 2.1.0)"
        required: true

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      ATUAL: ${{ inputs.atual }}
      ANTERIOR: ${{ inputs.anterior }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Situacao inicial - versao atual no ar
        run: bash scripts/deploy.sh "$ATUAL"

      - name: Rollback para a versao anterior
        run: bash scripts/deploy.sh "$ANTERIOR"

      - name: Confirmar que a versao anterior esta no ar
        env:
          VERSAO: ${{ inputs.anterior }} # o compose.yaml exige VERSAO ate para o "ps"
        run: |
          docker compose ps
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q "\"versao\":\"$ANTERIOR\""
          echo ">> Rollback confirmado: $ATUAL -> $ANTERIOR"